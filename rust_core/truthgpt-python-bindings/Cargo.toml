[package]
name = "truthgpt-python-bindings"
version = "0.1.0"
edition = "2021"

[lib]
name = "truthgpt_rust_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
truthgpt-core = { path = "../truthgpt-core" }
truthgpt-cache = { path = "../truthgpt-cache" }
truthgpt-models = { path = "../truthgpt-models" }
truthgpt-inference = { path = "../truthgpt-inference" }
truthgpt-optimization = { path = "../truthgpt-optimization" }
truthgpt-data = { path = "../truthgpt-data" }
