[package]
name = "truthgpt-data"
version = "1.0.0"
edition = "2021"

[dependencies]
truthgpt-core = { path = "../core" }

# Tokenization
tokenizers = { version = "0.15", default-features = false, features = ["onig"] }

# Data parallelism
rayon = "1.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# Utilities
tracing = "0.1"
