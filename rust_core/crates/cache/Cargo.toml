[package]
name = "truthgpt-cache"
version = "1.0.0"
edition = "2021"

[dependencies]
truthgpt-core = { path = "../core" }
truthgpt-optimization = { path = "../optimization" }

# Cache data structures
lru = "0.12"
hashbrown = { version = "0.14", features = ["serde"] }
dashmap = "5.5"

# Concurrency
parking_lot = "0.12"
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Collections
indexmap = { version = "2.2", features = ["serde"] }
