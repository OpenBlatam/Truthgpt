      - Custom Triton Kernels: guides/custom_kernels.md
      - Multi-Agent Workflows: guides/agent_workflows.md
      - KV-Cache Optimization: guides/kv_cache_optimization.md
      - Production Deployment: guides/production_deployment.md
  - Tutorials & FAQ:
      - Fine-Tuning LLaMA with LoRA: tutorials/finetune_llama_lora.md
      - High-Throughput Serving: tutorials/high_throughput_serving.md
      - Custom Research Papers: tutorials/custom_research_paper.md
