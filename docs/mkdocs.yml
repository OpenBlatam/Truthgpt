site_name: TruthGPT Optimization Core
site_description: High-performance deep learning training, polyglot compiler, and agentic swarm optimization ecosystem.
site_author: TruthGPT Team

theme:
  name: material
  language: en
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Overview: README.md
  - Getting Started:
      - Overview: getting_started/index.md
      - Installation: getting_started/installation.md
      - Quickstart LLM Training: getting_started/quickstart_training.md
      - Quickstart OpenClaw Agents: getting_started/quickstart_agents.md
      - Quickstart Compiler: getting_started/quickstart_compiler.md
  - Architecture:
      - System Overview: architecture/overview.md
      - Polyglot Core: architecture/polyglot_core.md
      - Compiler Runtime: architecture/compiler_runtime.md
      - PiMoE Architecture: architecture/pimoe.md
      - OpenClaw Agent Framework: architecture/agent_framework.md
  - API Reference:
      - API Directory: api/index.md
      - Trainers & Checkpointing: api/trainers.md
      - Models & Modules: api/models_modules.md
      - Optimizers & Schedulers: api/optimizers.md
      - Compiler & Acceleration: api/compiler.md
      - OpenClaw Agents SDK: api/agents.md
      - Polyglot Bindings: api/polyglot.md
      - Configuration Schema: api/configuration.md
      - Research Papers: api/papers.md
      - Utilities: api/utilities.md
  - Guides:
      - Optimization & Tuning: guides/optimization_tuning.md
      - Distributed Training: guides/distributed_training.md
      - Custom Agent Development: guides/custom_agent_development.md
      - Compiler & Custom Kernels: guides/compiler_and_kernels.md
      - Production Deployment: guides/deployment_production.md
      - Troubleshooting: guides/troubleshooting.md
  - Examples:
      - LLM Fine-Tuning: examples/basic_training.md
      - Research Swarm: examples/agent_swarms.md
      - Compiler Benchmarks: examples/compiler_benchmarks.md
