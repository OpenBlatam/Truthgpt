  - Getting Started:
      - Quick Start: quickstart.md
      - SOTA Ecosystem Quickstart: quickstart_sota.md
      - Installation Guide: installation.md
      - Architecture Overview: architecture.md
      - Optimization Guide: optimization.md
  - Training Subsystem:
      - Overview & Lifecycle: training/overview.md
      - Configuration Reference: training/configuration.md
      - Distributed Training: training/distributed.md
      - Callbacks & Monitoring: training/callbacks_monitoring.md
      - Checkpointing & EMA: training/checkpointing_recovery.md
  - Compiler & Acceleration:
      - Compiler Overview: compiler/overview.md
      - Triton & CUDA Kernels: compiler/triton_cuda_kernels.md
      - Integration Guide: compiler/integration_guide.md
  - Polyglot Core:
      - Polyglot Architecture: polyglot/overview.md
      - Rust & C++ Kernels: polyglot/rust_cpp_kernels.md
      - Distributed Bridge: polyglot/distributed_bridge.md
  - Autonomous Agents:
