version: '3.8'

services:
  truthgpt-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truthgpt-web-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_TRUTHGPT_API_URL=${NEXT_PUBLIC_TRUTHGPT_API_URL:-http://localhost:8000}
      - TRUTHGPT_API_KEY=${TRUTHGPT_API_KEY:-}
    restart: unless-stopped
